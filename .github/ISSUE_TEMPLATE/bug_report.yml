name: Bug report
description: Report a reproducible problem with SQLite Renamer for Stash.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include a Stash database, media files, credentials, or unredacted private paths and metadata. Report security vulnerabilities privately through the Security tab instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
      description: Include the relevant template and redacted configuration. State which command or workflow step produced the issue.
      placeholder: |
        1. For a dry run or saved-plan preview, set DRY_RUN = True. For plan apply, manifest undo, or a live run, set DRY_RUN = False and use the explicit CLI action when applicable.
        2. Use this redacted template/configuration: ...
        3. Run python run_renamer.py or sqlite-renamer --preview-plan ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.14.7
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options:
        - Dry run
        - Saved-plan preview
        - Plan apply
        - Manifest undo
        - Live run
        - Not applicable
    validations:
      required: true
