[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-renamer"
version = "0.1.0"
description = "Safe, plan-first Stash SQLite media filename renamer"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
sqlite-renamer = "run_renamer:main"

[tool.setuptools]
py-modules = [
    "config",
    "db",
    "execution",
    "logger",
    "planning",
    "rename_plan",
    "renamer",
    "run_manifest",
    "run_renamer",
    "undo",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["config.py", "db.py", "execution.py", "logger.py", "planning.py", "rename_plan.py", "renamer.py", "run_manifest.py", "run_renamer.py", "undo.py"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.interrogate]
fail-under = 80
exclude = [".venv", "build", "dist", "packaged-environment", "tests"]
verbose = 1
