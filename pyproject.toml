[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["config.py", "db.py", "execution.py", "logger.py", "planning.py", "rename_plan.py", "renamer.py", "run_manifest.py", "run_renamer.py"]
check_untyped_defs = true
warn_unused_ignores = true
